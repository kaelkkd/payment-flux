[project]
name = "fluxpay"
version = "0.1.0"
description = "Production-oriented event-driven payment processing portfolio project"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0,<1.0",
    "uvicorn[standard]>=0.35.0,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0,<3.0",
    "mypy>=1.17.0,<2.0",
    "pytest>=8.4.0,<9.0",
    "pytest-cov>=6.2.0,<7.0",
    "ruff>=0.12.0,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=services.payment_api --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
