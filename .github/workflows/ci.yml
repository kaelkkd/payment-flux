name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: make install

      - name: Run CI checks
        run: make ci
