services:
  payment-api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://fluxpay:fluxpay@postgres:5432/fluxpay
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')",
        ]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s
    depends_on:
      postgres: 
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fluxpay
      POSTGRES_PASSWORD: fluxpay
      POSTGRES_DB: fluxpay
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fluxpay", "-d", "fluxpay"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    volumes: 
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data: